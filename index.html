<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IoT Live Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
 body{font-family:system-ui,sans-serif;max-width:900px;margin:20px auto;padding:0 12px;background:#0f172a;color:#e2e8f0}
 h1{font-size:1.4rem}
 #banner{padding:18px;border-radius:12px;font-size:1.6rem;font-weight:700;text-align:center;background:#6b7280;margin-bottom:14px}
 #cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
 .card{background:#1e293b;border-radius:10px;padding:12px}
 .card small{display:block;color:#94a3b8;text-transform:uppercase;font-size:.7rem}
 .card b{font-size:1.5rem}
 select{padding:6px;margin-bottom:8px}
 .box{background:#1e293b;border-radius:12px;padding:12px}
</style></head>
<body>
<h1 id="title">IoT Live Monitor</h1>
<div id="banner">Waiting for device...</div>
<div id="ctl" style="display:none;margin-bottom:14px"><b>Remote pump control: </b>
 <button onclick="cmd('auto')">AUTO</button> <button onclick="cmd('on')">FORCE ON</button> <button onclick="cmd('off')">FORCE OFF</button></div>
<div id="cards"></div>
<div class="box">Graph: <select id="sel"></select><canvas id="chart"></canvas></div>
<script>
const SKIP=['t','status','level','title'];
function cmd(m){fetch('/api/cmd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pump:m})});}
const COLORS=['#16a34a','#d97706','#dc2626'];
let chart; const sel=document.getElementById('sel');
async function load(){
  try{
    const r=await (await fetch('/api/data')).json();
    const d=r.data; if(!d.length) return;
    const last=d[d.length-1];
    document.getElementById('title').textContent=last.title||'IoT Live Monitor';
    const offline=(r.now-last.t)/1000>20;
    const b=document.getElementById('banner');
    b.textContent=(offline?'DEVICE OFFLINE - last: ':'')+(last.status||'OK');
    b.style.background=offline?'#6b7280':COLORS[last.level||0];
    document.getElementById('ctl').style.display=(last.pump_mode!==undefined)?'block':'none';
    const keys=Object.keys(last).filter(k=>!SKIP.includes(k));
    document.getElementById('cards').innerHTML=keys.map(k=>'<div class="card"><small>'+k+'</small><b>'+last[k]+'</b></div>').join('');
    if(!sel.options.length) keys.forEach(k=>sel.add(new Option(k,k)));
    const k=sel.value;
    const labels=d.map(x=>new Date(x.t).toLocaleTimeString());
    const vals=d.map(x=>x[k]);
    if(!chart){
      chart=new Chart(document.getElementById('chart'),{type:'line',
        data:{labels,datasets:[{label:k,data:vals,tension:.3,borderColor:'#38bdf8'}]},
        options:{animation:false}});
    } else {
      chart.data.labels=labels; chart.data.datasets[0].label=k; chart.data.datasets[0].data=vals; chart.update();
    }
  }catch(e){}
}
load(); setInterval(load,3000);
</script></body></html>
